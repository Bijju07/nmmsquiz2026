    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

        body {

        .quiz-container {

        h1 {
            font-size: 2.2rem;
            color: #1e3c5c;
            text-align: center;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 1px 1px 0 #fff;
        }

        .subhead {
            text-align: center;
            font-size: 1.2rem;
            color: #2a4e6e;
            margin-bottom: 25px;

        .top-bar {
            display: flex;

            color: white;
            padding: 15px 25px;
            border-radius: 60px;
            margin-bottom: 25px;
            box-shadow: 0 8px 16px -6px #0a1e2e;

        }

        .score-badge {
            background: #ffb347;
            color: #1e2b3a;
            font-weight: 700;
            padding: 8px 22px;
            border-radius: 40px;

            box-shadow: inset 0 -3px 0 #b16f1a;

        }

        .progress-text {
            font-size: 1.1rem;
            background: #2e577a;
            padding: 6px 18px;

        }

        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {

            border-radius: 40px;
            border: 2px solid #3c6e9c;
            background: white;
            color: #1e3c5c;

        .filter-btn.active {

        }

        .questions-grid {

        .questions-grid::-webkit-scrollbar {

        .questions-grid::-webkit-scrollbar-track {
            background: #e0eaf3;

        }

        .questions-grid::-webkit-scrollbar-thumb {
            background: #3c6e9c;

        .question-card {
            background: #ffffff;
            border-left: 8px solid #3c6e9c;
            border-radius: 20px;

            flex-wrap: wrap;

        }

        .question-card.correct-highlight {
            border-left-color: #2e7d32;

        .question-card.wrong-highlight {

        }

        .q-num {
            background: #1e3c5c;
            color: white;
            width: 42px;

            align-items: center;

            font-weight: 700;
            font-size: 1rem;

        .q-text {

            color: #102b40;

        .subject-tag {

        .subject-tag.science {

        .subject-tag.maths {

        .options {

        .option-item {

            border: 1.5px solid transparent;

        .option-item:hover {
            background: #d4e3f5;
            border-color: #7fa5c2;
        }

        .option-item input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #3c6e9c;
            border-radius: 50%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
            cursor: pointer;
        }

        .option-item input[type="radio"]:checked {
            background: #1e3c5c;
            border-color: #1e3c5c;
            box-shadow: inset 0 0 0 4px white;
        }

        .option-item.selected {
            background: #cfe2f7;
            border-color: #1e3c5c;
        }

        .explanation-box {
            width: 100%;
            margin-top: 10px;
            padding: 12px 18px;
            background: #eef6ff;
            border-radius: 14px;
            border-left: 6px solid #1e3c5c;
            font-size: 0.96rem;
            color: #153e5c;
            line-height: 1.6;
            display: none;
        }

        .explanation-box.show {

        }

        .explanation-box strong {

        .btn-group {

        .btn {

            font-size: 1.25rem;
            font-weight: 700;
            border-radius: 60px;

            box-shadow: 0 8px 0 #0f2a3f;

            align-items: center;

        .btn-primary {

            box-shadow: 0 8px 0 #b16f1a;
        }

        .btn-primary:hover {
            background: #ffa21e;
            transform: translateY(2px);
            box-shadow: 0 6px 0 #b16f1a;
        }

        .btn-primary:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #b16f1a;
        }

        .btn-secondary {
            background: #e0eaf3;
            color: #1e3c5c;
            box-shadow: 0 8px 0 #a0b8cc;
        }

        .btn-secondary:hover {
            background: #d0dfee;
            transform: translateY(2px);
            box-shadow: 0 6px 0 #a0b8cc;
        }

        .btn-secondary:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #a0b8cc;
        }

        .result-panel {
            background: #1e3c5c;
            color: white;
            border-radius: 32px;
            padding: 30px 25px;
            margin-top: 30px;
            text-align: center;
            box-shadow: inset 0 -5px 0 #0a1e2e, 0 15px 25px -5px #0a1e2e;
        }

        .result-panel h2 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: #ffd966;
            text-shadow: 2px 2px 0 #0a1e2e;
        }

        .score-display {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.2;
            color: #ffffff;
            margin: 10px 0;
        }

        .score-display small {
            font-size: 2rem;
            font-weight: 400;
            color: #b8d0e5;
        }

        .result-message {
            font-size: 1.6rem;
            font-weight: 600;
            background: #2e577a;
            display: inline-block;
            padding: 12px 40px;
            border-radius: 50px;
            margin: 20px 0 10px;
            color: #ffecb3;
        }

        .section-breakdown {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .breakdown-item {
            background: #2e577a;
            padding: 10px 25px;
            border-radius: 40px;
            font-size: 1.1rem;
        }

        .hidden {
            display: none;
        }

        .kannada-note {
            font-size: 0.9rem;
            color: #4a6279;
            text-align: right;
            margin-top: 8px;
            font-style: italic;
        }

        .pagination-info {
            text-align: center;
            font-size: 0.9rem;
            color: #4a6279;
            margin-bottom: 10px;
        }

        @media (max-width: 700px) {
            .quiz-container {

            }
            .question-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .q-text {
                font-size: 1rem;
            }
            .btn {
                padding: 14px 22px;
                font-size: 1.1rem;
            }
            .score-display {
                font-size: 3rem;
            }
            .top-bar {
                justify-content: center;
            }
        }
    </style>

<body>
    <div class="quiz-container" id="quizApp">
        <h1>📘 ಎನ್‌ಎಂಎಂಎಸ್ 200 ಪ್ರಶ್ನೆಗಳು</h1>
        <div class="subhead">ವಿಜ್ಞಾನ ಮತ್ತು ಗಣಿತ | ವಿವರಣೆ ಸಹಿತ</div>

        <div class="top-bar">
            <div class="progress-text" id="progressText">0 / 200 ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಲಾಗಿದೆ</div>
            <div class="score-badge" id="liveScore">ಅಂಕ: 0</div>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">ಎಲ್ಲಾ (200)</button>
            <button class="filter-btn" data-filter="science">ವಿಜ್ಞಾನ (100)</button>
            <button class="filter-btn" data-filter="maths">ಗಣಿತ (100)</button>
        </div>

        <div class="pagination-info" id="paginationInfo"></div>

        <div class="questions-grid" id="questionsGrid"></div>

        <div class="btn-group">
            <button class="btn btn-primary" id="submitBtn"><i class="fas fa-check-circle"></i> ಫಲಿತಾಂಶ ಮತ್ತು ವಿವರಣೆ ನೋಡಿ</button>
            <button class="btn btn-secondary" id="resetBtn"><i class="fas fa-redo-alt"></i> ಮರುಪ್ರಯತ್ನ</button>
        </div>

        <div class="result-panel hidden" id="resultPanel">
            <h2>📊 ನಿಮ್ಮ ಫಲಿತಾಂಶ</h2>
            <div class="score-display" id="finalScore">0<small>/200</small></div>
            <div class="result-message" id="resultMessage">ಉತ್ತಮ ಪ್ರಯತ್ನ!</div>
            <div class="section-breakdown" id="sectionBreakdown"></div>
            <p style="margin-top: 20px; font-size: 1.1rem; opacity: 0.9;">ಎನ್‌ಎಂಎಂಎಸ್ ತಯಾರಿಗೆ ಶುಭಾಶಯಗಳು ✨</p>
        </div>
        <div class="kannada-note">* ಪ್ರತಿ ಪ್ರಶ್ನೆಗೆ ಒಂದು ಅಂಕ | ವಿವರಣೆಗಳು ಫಲಿತಾಂಶದ ನಂತರ ತೋರಿಸಲಾಗುತ್ತದೆ</div>
    </div>

    <script>
        (function() {
            // ============================================================
            // 200 NMMS questions: 100 Science + 100 Maths
            // Each: q, options, correct (index), explanation (Kannada),
            // subject ('science' or 'maths')
            // ============================================================
            const questionsData = [
                // =========================================================
                // SCIENCE - 100 QUESTIONS (index 0-99)
                // =========================================================
                // 1-10
                { q: "ಸಸ್ಯಗಳು ಆಹಾರ ತಯಾರಿಸುವ ಪ್ರಕ್ರಿಯೆಯ ಹೆಸರೇನು?", options: ["ಉಸಿರಾಟ", "ದ್ಯುತಿಸಂಶ್ಲೇಷಣೆ", "ಬಾಷ್ಪೀಕರಣ", "ಸಂಚಯನ"], correct: 1, subject: 'science', explanation: "ಸಸ್ಯಗಳು ಸೂರ್ಯನ ಬೆಳಕು, ನೀರು ಮತ್ತು ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್ ಬಳಸಿ ಆಹಾರ (ಗ್ಲೂಕೋಸ್) ತಯಾರಿಸುವ ಪ್ರಕ್ರಿಯೆಯನ್ನು ದ್ಯುತಿಸಂಶ್ಲೇಷಣೆ ಎನ್ನುತ್ತಾರೆ." },
                { q: "ನೀರಿನ ರಾಸಾಯನಿಕ ಸೂತ್ರ ಯಾವುದು?", options: ["CO₂", "H₂O", "O₂", "NaCl"], correct: 1, subject: 'science', explanation: "ನೀರಿನ ಅಣುವಿನಲ್ಲಿ 2 ಹೈಡ್ರೋಜನ್ ಪರಮಾಣುಗಳು ಮತ್ತು 1 ಆಮ್ಲಜನಕ ಪರಮಾಣು ಇರುತ್ತದೆ. ಆದ್ದರಿಂದ ಸೂತ್ರ H₂O." },
                { q: "ಸೂರ್ಯನಿಗೆ ಅತ್ಯಂತ ಸಮೀಪದ ಗ್ರಹ ಯಾವುದು?", options: ["ಶುಕ್ರ", "ಬುಧ", "ಮಂಗಳ", "ಗುರು"], correct: 1, subject: 'science', explanation: "ಸೂರ್ಯನಿಂದ ಅತ್ಯಂತ ಸಮೀಪದ ಗ್ರಹ ಬುಧ (Mercury). ಇದು ಸೂರ್ಯನಿಂದ ಸುಮಾರು 57.9 ಮಿಲಿಯನ್ ಕಿ.ಮೀ ದೂರದಲ್ಲಿದೆ." },
                { q: "ಮಾನವ ದೇಹದಲ್ಲಿ ಎಷ್ಟು ಮೂಳೆಗಳಿವೆ? (ವಯಸ್ಕರಲ್ಲಿ)", options: ["206", "300", "150", "250"], correct: 0, subject: 'science', explanation: "ವಯಸ್ಕ ಮಾನವ ದೇಹದಲ್ಲಿ 206 ಮೂಳೆಗಳಿರುತ್ತವೆ. ಹುಟ್ಟುವಾಗ ಸುಮಾರು 300 ಮೂಳೆಗಳಿದ್ದು, ಬೆಳೆದಂತೆ ಕೆಲವು ಸೇರಿಕೊಳ್ಳುತ್ತವೆ." },
                { q: "ಗಾಳಿಯಲ್ಲಿ ಆಮ್ಲಜನಕದ ಶೇಕಡಾವಾರು ಪ್ರಮಾಣ ಎಷ್ಟು?", options: ["21%", "78%", "0.04%", "50%"], correct: 0, subject: 'science', explanation: "ಗಾಳಿಯಲ್ಲಿ ಸಾರಜನಕ ~78%, ಆಮ್ಲಜನಕ ~21%, ಆರ್ಗಾನ್ ~0.9%, ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್ ~0.04% ಇರುತ್ತದೆ." },
                { q: "ಬೆಳಕಿನ ವೇಗ ಎಷ್ಟು? (ನಿರ್ವಾತದಲ್ಲಿ)", options: ["3×10⁸ m/s", "3×10⁶ m/s", "3×10¹⁰ m/s", "3×10⁵ m/s"], correct: 0, subject: 'science', explanation: "ನಿರ್ವಾತದಲ್ಲಿ ಬೆಳಕಿನ ವೇಗ ಸುಮಾರು 3×10⁸ ಮೀಟರ್/ಸೆಕೆಂಡ್ (ಅಂದರೆ 3,00,000 ಕಿ.ಮೀ/ಸೆ)." },
                { q: "ಜೀವಕೋಶದ ಶಕ್ತಿ ಕೇಂದ್ರ ಎಂದು ಯಾವುದನ್ನು ಕರೆಯುತ್ತಾರೆ?", options: ["ಕೋಶಕೇಂದ್ರ", "ಮೈಟೊಕಾಂಡ್ರಿಯ", "ರೈಬೋಸೋಮ್", "ಗಾಲ್ಗಿ"], correct: 1, subject: 'science', explanation: "ಮೈಟೊಕಾಂಡ್ರಿಯವು ಜೀವಕೋಶದ ಶಕ್ತಿ ಉತ್ಪಾದನಾ ಕೇಂದ್ರ. ಇದು ATP ರೂಪದಲ್ಲಿ ಶಕ್ತಿ ಉತ್ಪಾದಿಸುತ್ತದೆ." },
                { q: "ಧ್ವನಿಯು ಯಾವ ಮಾಧ್ಯಮದಲ್ಲಿ ಚಲಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ?", options: ["ಘನ", "ದ್ರವ", "ಅನಿಲ", "ನಿರ್ವಾತ"], correct: 3, subject: 'science', explanation: "ಧ್ವನಿ ಚಲಿಸಲು ಮಾಧ್ಯಮದ ಅಣುಗಳು ಬೇಕು. ನಿರ್ವಾತದಲ್ಲಿ ಅಣುಗಳಿಲ್ಲದ ಕಾರಣ ಧ್ವನಿ ಚಲಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ." },
                { q: "ನಮ್ಮ ದೇಹದಲ್ಲಿ ರಕ್ತ ಪರಿಚಲನೆ ಮಾಡುವ ಅಂಗ ಯಾವುದು?", options: ["ಹೃದಯ", "ಮೂತ್ರಪಿಂಡ", "ಯಕೃತ್ತು", "ಶ್ವಾಸಕೋಶ"], correct: 0, subject: 'science', explanation: "ಹೃದಯವು ರಕ್ತವನ್ನು ಪಂಪ್ ಮಾಡಿ ಇಡೀ ದೇಹದಲ್ಲಿ ಪರಿಚಲನೆ ಮಾಡುತ್ತದೆ." },
                { q: "ಬಲ ಮತ್ತು ಚಲನೆಯ ನಿಯಮಗಳನ್ನು ಕಂಡುಹಿಡಿದವರು ಯಾರು?", options: ["ಐನ್‌ಸ್ಟೈನ್", "ನ್ಯೂಟನ್", "ಗೆಲಿಲಿಯೋ", "ಆರ್ಕಿಮಿಡೀಸ್"], correct: 1, subject: 'science', explanation: "ಸರ್ ಐಸಾಕ್ ನ್ಯೂಟನ್ ಮೂರು ಚಲನಾ ನಿಯಮಗಳನ್ನು ಪ್ರತಿಪಾದಿಸಿದರು." },
                // 11-20 Science
                { q: "ನೀರಿನ ಕುದಿಯುವ ಬಿಂದು (ಸಮುದ್ರ ಮಟ್ಟದಲ್ಲಿ) ಎಷ್ಟು?", options: ["0°C", "100°C", "50°C", "212°C"], correct: 1, subject: 'science', explanation: "ಸಮುದ್ರ ಮಟ್ಟದಲ್ಲಿ ನೀರು 100°C ನಲ್ಲಿ ಕುದಿಯುತ್ತದೆ." },
                { q: "ಸಸ್ಯಗಳು ಯಾವ ಅನಿಲವನ್ನು ಹೀರಿಕೊಳ್ಳುತ್ತವೆ?", options: ["ಆಮ್ಲಜನಕ", "ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್", "ಸಾರಜನಕ", "ಹೈಡ್ರೋಜನ್"], correct: 1, subject: 'science', explanation: "ದ್ಯುತಿಸಂಶ್ಲೇಷಣೆಯಲ್ಲಿ ಸಸ್ಯಗಳು CO₂ ಹೀರಿಕೊಳ್ಳುತ್ತವೆ." },
                { q: "ಮಾನವನ ರಕ್ತದ pH ಮೌಲ್ಯ ಎಷ್ಟು?", options: ["7.4", "5.6", "8.4", "6.0"], correct: 0, subject: 'science', explanation: "ಸಾಮಾನ್ಯ ಮಾನವ ರಕ್ತದ pH ಸುಮಾರು 7.4 (ಸ್ವಲ್ಪ ಕ್ಷಾರೀಯ)." },
                { q: "ಬೆಳಕಿನ ವರ್ಣವಿಭಜನೆ ಮಾಡುವ ಸಾಧನ ಯಾವುದು?", options: ["ಮಸೂರ", "ಪ್ರಿಸ್ಮ್", "ಕನ್ನಡಿ", "ದರ್ಪಣ"], correct: 1, subject: 'science', explanation: "ಪ್ರಿಸ್ಮ್ ಬಿಳಿ ಬೆಳಕನ್ನು ಏಳು ಬಣ್ಣಗಳಾಗಿ ವಿಭಜಿಸುತ್ತದೆ." },
                { q: "ಕೆಳಗಿನವುಗಳಲ್ಲಿ ಯಾವುದು ನವೀಕರಿಸಲಾಗದ ಶಕ್ತಿ ಮೂಲ?", options: ["ಸೂರ್ಯ", "ಗಾಳಿ", "ಕಲ್ಲಿದ್ದಲು", "ನೀರು"], correct: 2, subject: 'science', explanation: "ಕಲ್ಲಿದ್ದಲು ಪಳೆಯುಳಿಕೆ ಇಂಧನ, ಇದು ಮರುಪೂರಣವಾಗದ ಕಾರಣ ನವೀಕರಿಸಲಾಗದ ಶಕ್ತಿ ಮೂಲ." },
                { q: "ಅಣುವಿನ ಕೇಂದ್ರದಲ್ಲಿ ಯಾವುದಿರುತ್ತದೆ?", options: ["ಎಲೆಕ್ಟ್ರಾನ್", "ಪ್ರೋಟಾನ್ ಮತ್ತು ನ್ಯೂಟ್ರಾನ್", "ಫೋಟಾನ್", "ಅಯಾನ್"], correct: 1, subject: 'science', explanation: "ಅಣುವಿನ ನ್ಯೂಕ್ಲಿಯಸ್‌ನಲ್ಲಿ ಪ್ರೋಟಾನ್ ಮತ್ತು ನ್ಯೂಟ್ರಾನ್ ಇರುತ್ತವೆ." },
                { q: "ಸಾಮಾನ್ಯ ಉಷ್ಣತಾಮಾಪಕದಲ್ಲಿ ಯಾವ ದ್ರವ ಬಳಸುತ್ತಾರೆ?", options: ["ನೀರು", "ಪಾದರಸ", "ಆಲ್ಕೋಹಾಲ್", "ಎಣ್ಣೆ"], correct: 1, subject: 'science', explanation: "ಪಾದರಸವು ತಾಪಕ್ಕೆ ಅನುಗುಣವಾಗಿ ವಿಸ್ತರಿಸುವ ಕಾರಣ ಉಷ್ಣತಾಮಾಪಕದಲ್ಲಿ ಬಳಸುತ್ತಾರೆ." },
                { q: "ಒಂದು ವಸ್ತುವಿನ ಸಾಂದ್ರತೆ = ?", options: ["ರಾಶಿ × ಘನಫಲ", "ರಾಶಿ / ಘನಫಲ", "ಘನಫಲ / ರಾಶಿ", "ರಾಶಿ + ಘನಫಲ"], correct: 1, subject: 'science', explanation: "ಸಾಂದ್ರತೆ = ರಾಶಿ / ಘನಫಲ (ρ = m/V)." },
                { q: "ಮಾನವನಲ್ಲಿ ಎಷ್ಟು ಪ್ರಕಾರದ ಹಲ್ಲುಗಳಿವೆ?", options: ["2", "3", "4", "5"], correct: 2, subject: 'science', explanation: "ನಾಲ್ಕು ಪ್ರಕಾರ: ಬಾಚಿಹಲ್ಲು (incisors), ಕೋರೆಹಲ್ಲು (canines), ಮುಂಗಡಿಗಳು (premolars), ದವಡೆಹಲ್ಲು (molars)." },
                { q: "ಸೌರಮಂಡಲದ ಅತಿದೊಡ್ಡ ಗ್ರಹ ಯಾವುದು?", options: ["ಭೂಮಿ", "ಗುರು", "ಶನಿ", "ನೆಪ್ಚೂನ್"], correct: 1, subject: 'science', explanation: "ಗುರು (Jupiter) ಅತಿದೊಡ್ಡ ಗ್ರಹ, ಇದರಲ್ಲಿ 1300 ಭೂಮಿಗಳು ಹಿಡಿಯಬಹುದು." },
                // 21-30 Science
                { q: "ವಾತಾವರಣದಲ್ಲಿ ಓಝೋನ್ ಪದರದ ಮುಖ್ಯ ಕಾರ್ಯ ಏನು?", options: ["ಆಮ್ಲಜನಕ ನೀಡುವುದು", "ಅತಿನೇರಳೆ ಕಿರಣಗಳನ್ನು ತಡೆಯುವುದು", "ಮಳೆ ತರುವುದು", "ಇಂಗಾಲದ ಡೈಆಕ್ಸೈಡ್ ಹೀರುವುದು"], correct: 1, subject: 'science', explanation: "ಓಝೋನ್ ಪದರವು ಸೂರ್ಯನಿಂದ ಬರುವ ಹಾನಿಕಾರಕ ಅತಿನೇರಳೆ (UV) ಕಿರಣಗಳನ್ನು ತಡೆಯುತ್ತದೆ." },
                { q: "ಜೀವಿಗಳ ವರ್ಗೀಕರಣದಲ್ಲಿ ಮೊದಲನೇ ಹಂತ ಯಾವುದು?", options: ["ಜಾತಿ", "ಸಾಮ್ರಾಜ್ಯ", "ವರ್ಗ", "ಕುಟುಂಬ"], correct: 1, subject: 'science', explanation: "ವರ್ಗೀಕರಣದ ಶ್ರೇಣಿ: ಸಾಮ್ರಾಜ್ಯ (Kingdom) → ವಿಭಾಗ → ವರ್ಗ → ಗಣ → ಕುಟುಂಬ → ಜಾತಿ." },
                { q: "ನ್ಯೂಕ್ಲಿಯಸ್‌ನಲ್ಲಿ ಯಾವ ಕಣಗಳಿವೆ?", options: ["ಎಲೆಕ್ಟ್ರಾನ್ ಮತ್ತು ಪ್ರೋಟಾನ್", "ಪ್ರೋಟಾನ್ ಮತ್ತು ನ್ಯೂಟ್ರಾನ್", "ಎಲೆಕ್ಟ್ರಾನ್ ಮತ್ತು ನ್ಯೂಟ್ರಾನ್", "ಫೋಟಾನ್"], correct: 1, subject: 'science', explanation: "ನ್ಯೂಕ್ಲಿಯಸ್‌ನಲ್ಲಿ ಪ್ರೋಟಾನ್ (ಧನ) ಮತ್ತು ನ್ಯೂಟ್ರಾನ್ (ತಟಸ್ಥ) ಇರುತ್ತವೆ." },
                { q: "ಮಾನವನಲ್ಲಿ ಎಷ್ಟು ವರ್ಣತಂತುಗಳಿವೆ?", options: ["23", "46", "44", "22"], correct: 1, subject: 'science', explanation: "ಮಾನವನ ದೇಹಕೋಶದಲ್ಲಿ 46 ವರ್ಣತಂತುಗಳು (23 ಜೋಡಿ)." },
                { q: "ಬಲದ SI ಏಕಮಾನ ಯಾವುದು?", options: ["ಜೂಲ್", "ನ್ಯೂಟನ್", "ವಾಟ್", "ಪ್ಯಾಸ್ಕಲ್"], correct: 1, subject: 'science', explanation: "ಬಲದ SI ಏಕಮಾನ ನ್ಯೂಟನ್ (N). 1 N = 1 kg·m/s²." },
                { q: "ಸಸ್ಯಗಳಲ್ಲಿ ನೀರು ಮತ್ತು ಖನಿಜಗಳ ಸಾಗಣೆ ಮಾಡುವ ಅಂಗಾಂಶ ಯಾವುದು?", options: ["ಜೈಲಂ", "ಫ್ಲೋಯಂ", "ಎಪಿಡರ್ಮಿಸ್", "ಕಾರ್ಟೆಕ್ಸ್"], correct: 0, subject: 'science', explanation: "ಜೈಲಂ (Xylem) ನೀರು ಮತ್ತು ಖನಿಜಗಳನ್ನು ಬೇರಿನಿಂದ ಎಲೆಗಳಿಗೆ ಸಾಗಿಸುತ್ತದೆ." },
                { q: "ಮಳೆಬಿಲ್ಲಿನಲ್ಲಿ ಎಷ್ಟು ಬಣ್ಣಗಳಿವೆ?", options: ["5", "6", "7", "8"], correct: 2, subject: 'science', explanation: "ಮಳೆಬಿಲ್ಲಿನಲ್ಲಿ 7 ಬಣ್ಣಗಳು: ಕೆಂಪು, ಕಿತ್ತಳೆ, ಹಳದಿ, ಹಸಿರು, ನೀಲಿ, ನೇರಳೆ, ಬಿಳಿ." },
                { q: "ಚಂದ್ರನ ಮೇಲೆ ಮೊದಲು ಕಾಲಿಟ್ಟವರು ಯಾರು?", options: ["ನೀಲ್ ಆರ್ಮ್‌ಸ್ಟ್ರಾಂಗ್", "ಬಜ್ ಆಲ್ಡ್ರಿನ್", "ಯೂರಿ ಗಾಗರಿನ್", "ಮೈಕೆಲ್ ಕಾಲಿನ್ಸ್"], correct: 0, subject: 'science', explanation: "1969 ಜುಲೈ 20 ರಂದು ನೀಲ್ ಆರ್ಮ್‌ಸ್ಟ್ರಾಂಗ್ ಚಂದ್ರನ ಮೇಲೆ ಮೊದಲ ಹೆಜ್ಜೆ ಇಟ್ಟರು." },
                { q: "ಬೆಳಕಿನ ವಕ್ರೀಭವನದ ನಿಯಮ ಯಾವುದು?", options: ["ಸ್ನೆಲ್ ನಿಯಮ", "ನ್ಯೂಟನ್ ನಿಯಮ", "ಓಮ್ ನಿಯಮ", "ಫ್ಯಾರಡೆ ನಿಯಮ"], correct: 0, subject: 'science', explanation: "ಸ್ನೆಲ್ ನಿಯಮ: sin i / sin r = ಸ್ಥಿರಾಂಕ (ವಕ್ರೀಭವನ ಸೂಚ್ಯಂಕ)." },
                { q: "ಒಂದು ವಸ್ತುವಿನ ತೂಕ = ?", options: ["ರಾಶಿ × ಗುರುತ್ವ", "ರಾಶಿ / ಗುರುತ್ವ", "ಗುರುತ್ವ / ರಾಶಿ", "ರಾಶಿ + ಗುರುತ್ವ"], correct: 0, subject: 'science', explanation: "ತೂಕ = ರಾಶಿ × ಗುರುತ್ವಾಕರ್ಷಣೆಯಿಂದ ಉಂಟಾಗುವ ವೇಗೋತ್ಕರ್ಷ (W = mg)." },
                // 31-40 Science
                { q: "ರಕ್ತದಲ್ಲಿನ ಸಕ್ಕರೆ ಮಟ್ಟವನ್ನು ನಿಯಂತ್ರಿಸುವ ಹಾರ್ಮೋನ್ ಯಾವುದು?", options: ["ಇನ್ಸುಲಿನ್", "ಥೈರಾಕ್ಸಿನ್", "ಅಡ್ರಿನಾಲಿನ್", "ಈಸ್ಟ್ರೋಜನ್"], correct: 0, subject: 'science', explanation: "ಇನ್ಸುಲಿನ್ ಹಾರ್ಮೋನ್ ರಕ್ತದ ಸಕ್ಕರೆಯನ್ನು ನಿಯಂತ್ರಿಸುತ್ತದೆ. ಕೊರತೆಯಿಂದ ಮಧುಮೇಹ." },
                { q: "ಸಸ್ಯಗಳಲ್ಲಿ ಆಹಾರ ಸಂಗ್ರಹಿಸುವ ಅಂಗ ಯಾವುದು?", options: ["ಬೇರು", "ಕಾಂಡ", "ಎಲೆ", "ಹೂ"], correct: 0, subject: 'science', explanation: "ಕೆಲವು ಸಸ್ಯಗಳ ಬೇರುಗಳು (ಉದಾ: ಗೆಣಸು, ಆಲೂಗಡ್ಡೆ) ಆಹಾರ ಸಂಗ್ರಹಿಸುತ್ತವೆ." },
                { q: "ನೀರಿನಲ್ಲಿ ಕರಗುವ ವಿಟಮಿನ್ ಯಾವುದು?", options: ["ವಿಟಮಿನ್ A", "ವಿಟಮಿನ್ C", "ವಿಟಮಿನ್ D", "ವಿಟಮಿನ್ K"], correct: 1, subject: 'science', explanation: "ವಿಟಮಿನ್ C ಮತ್ತು B ಸಮೂಹ ವಿಟಮಿನ್‌ಗಳು ನೀರಿನಲ್ಲಿ ಕರಗುತ್ತವೆ." },
                { q: "ಧ್ವನಿಯ ತೀವ್ರತೆಯ ಏಕಮಾನ?", options: ["ಡೆಸಿಬೆಲ್", "ಹರ್ಟ್ಝ್", "ನ್ಯೂಟನ್", "ಜೂಲ್"], correct: 0, subject: 'science', explanation: "ಧ್ವನಿಯ ತೀವ್ರತೆಯನ್ನು ಡೆಸಿಬೆಲ್ (dB) ನಲ್ಲಿ ಅಳೆಯುತ್ತಾರೆ." },
                { q: "ಭೂಮಿಯ ವಾತಾವರಣದಲ್ಲಿ ಅತ್ಯಂತ ಹೆಚ್ಚಿರುವ ಅನಿಲ?", options: ["ಆಮ್ಲಜನಕ", "ಸಾರಜನಕ", "ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್", "ಆರ್ಗಾನ್"], correct: 1, subject: 'science', explanation: "ಸಾರಜನಕ (Nitrogen) ~78% ಪ್ರಮಾಣದಲ್ಲಿ ಇದೆ." },
                { q: "ಮಾನವನ ಉಸಿರಾಟದ ಅಂಗ ಯಾವುದು?", options: ["ಹೃದಯ", "ಶ್ವಾಸಕೋಶ", "ಮೂತ್ರಪಿಂಡ", "ಯಕೃತ್ತು"], correct: 1, subject: 'science', explanation: "ಶ್ವಾಸಕೋಶವು ಆಮ್ಲಜನಕವನ್ನು ತೆಗೆದುಕೊಂಡು CO₂ ಬಿಡುಗಡೆ ಮಾಡುತ್ತದೆ." },
                { q: "ಸೂರ್ಯನಿಂದ ಭೂಮಿಗೆ ಬರುವ ಶಕ್ತಿಯ ಮೂಲ ಯಾವುದು?", options: ["ಬೆಳಕು", "ಶಾಖ", "ಬೆಳಕು ಮತ್ತು ಶಾಖ", "ಧ್ವನಿ"], correct: 2, subject: 'science', explanation: "ಸೂರ್ಯನು ಬೆಳಕು ಮತ್ತು ಶಾಖ ಎರಡೂ ರೂಪದಲ್ಲಿ ಶಕ್ತಿ ನೀಡುತ್ತಾನೆ." },
                { q: "ಬ್ಯಾಕ್ಟೀರಿಯಾ ಯಾವ ರೀತಿಯ ಜೀವಿ?", options: ["ಬಹುಕೋಶೀಯ", "ಏಕಕೋಶೀಯ", "ಯಾವುದೂ ಅಲ್ಲ", "ಸಸ್ಯ"], correct: 1, subject: 'science', explanation: "ಬ್ಯಾಕ್ಟೀರಿಯಾ ಏಕಕೋಶೀಯ ಜೀವಿಗಳು, ಸೂಕ್ಷ್ಮದರ್ಶಕದಲ್ಲಿ ಮಾತ್ರ ಕಾಣುತ್ತವೆ." },
                { q: "ಗುರುತ್ವಾಕರ್ಷಣೆಯಿಂದ ವಸ್ತುಗಳು ಯಾವ ದಿಕ್ಕಿಗೆ ಬೀಳುತ್ತವೆ?", options: ["ಮೇಲಕ್ಕೆ", "ಕೆಳಕ್ಕೆ", "ಎಡಕ್ಕೆ", "ಬಲಕ್ಕೆ"], correct: 1, subject: 'science', explanation: "ಭೂಮಿಯ ಗುರುತ್ವಾಕರ್ಷಣೆ ವಸ್ತುಗಳನ್ನು ಕೆಳಕ್ಕೆ ಎಳೆಯುತ್ತದೆ." },
                { q: "ನಮ್ಮ ದೇಹದಲ್ಲಿ ಅತ್ಯಂತ ದೊಡ್ಡ ಅಂಗ ಯಾವುದು?", options: ["ಚರ್ಮ", "ಯಕೃತ್ತು", "ಮೆದುಳು", "ಹೃದಯ"], correct: 0, subject: 'science', explanation: "ಚರ್ಮವು ದೇಹದ ಅತಿದೊಡ್ಡ ಅಂಗ, ಇದು ರಕ್ಷಣೆ ಮತ್ತು ಉಷ್ಣತೆ ನಿಯಂತ್ರಿಸುತ್ತದೆ." },
                // 41-50 Science
                { q: "ಸಸ್ಯಗಳಲ್ಲಿ ದ್ಯುತಿಸಂಶ್ಲೇಷಣೆ ನಡೆಯುವ ಅಂಗಾಂಶ?", options: ["ಪತ್ರಹರಿತ್ತು", "ಜೈಲಂ", "ಫ್ಲೋಯಂ", "ಎಪಿಡರ್ಮಿಸ್"], correct: 0, subject: 'science', explanation: "ಪತ್ರಹರಿತ್ತು (Chloroplast) ನಲ್ಲಿ ಹಸಿರು ವರ್ಣದ್ರವ್ಯ ಕ್ಲೋರೊಫಿಲ್ ಇದ್ದು ದ್ಯುತಿಸಂಶ್ಲೇಷಣೆ ನಡೆಯುತ್ತದೆ." },
                { q: "ಆವರ್ತಕ ಕೋಷ್ಟಕದಲ್ಲಿ ಮೊದಲನೇ ಧಾತು ಯಾವುದು?", options: ["ಹೈಡ್ರೋಜನ್", "ಹೀಲಿಯಂ", "ಆಮ್ಲಜನಕ", "ಇಂಗಾಲ"], correct: 0, subject: 'science', explanation: "ಆವರ್ತಕ ಕೋಷ್ಟಕದಲ್ಲಿ ಮೊದಲನೇ ಧಾತು ಹೈಡ್ರೋಜನ್ (H), ಪರಮಾಣು ಸಂಖ್ಯೆ 1." },
                { q: "ಮಾನವನ ಹೃದಯದಲ್ಲಿ ಎಷ್ಟು ಕೋಣೆಗಳಿವೆ?", options: ["2", "3", "4", "5"], correct: 2, subject: 'science', explanation: "ಮಾನವ ಹೃದಯದಲ್ಲಿ 4 ಕೋಣೆಗಳು: 2 ಆಲಿಂಡ್ರಿಕಲ್ಸ್ (atria), 2 ವೆಂಟ್ರಿಕಲ್ಸ್." },
                { q: "ಸೌರಶಕ್ತಿಯನ್ನು ವಿದ್ಯುತ್ ಆಗಿ ಪರಿವರ್ತಿಸುವ ಸಾಧನ?", options: ["ಸೋಲಾರ್ ಸೆಲ್", "ಜನರೇಟರ್", "ಬ್ಯಾಟರಿ", "ಮೋಟಾರ್"], correct: 0, subject: 'science', explanation: "ಸೋಲಾರ್ ಸೆಲ್ (PV cell) ಸೂರ್ಯನ ಬೆಳಕನ್ನು ನೇರವಾಗಿ ವಿದ್ಯುತ್ ಆಗಿ ಪರಿವರ್ತಿಸುತ್ತದೆ." },
                { q: "ಧ್ವನಿಯು ಗಾಳಿಯಲ್ಲಿ ಚಲಿಸುವ ವೇಗ (ಸುಮಾರು)?", options: ["343 m/s", "3×10⁸ m/s", "1500 m/s", "30 m/s"], correct: 0, subject: 'science', explanation: "ಗಾಳಿಯಲ್ಲಿ ಧ್ವನಿಯ ವೇಗ ಸುಮಾರು 343 ಮೀ/ಸೆ (20°C ನಲ್ಲಿ)." },
                { q: "ನಮ್ಮ ಮೆದುಳಿನ ಯಾವ ಭಾಗವು ಸಮತೋಲನವನ್ನು ನಿಯಂತ್ರಿಸುತ್ತದೆ?", options: ["ಸೆರೆಬ್ರಮ್", "ಸೆರೆಬೆಲ್ಲಮ್", "ಮೆಡುಲ್ಲಾ", "ಥಾಲಮಸ್"], correct: 1, subject: 'science', explanation: "ಸೆರೆಬೆಲ್ಲಮ್ (ಹಿಂದಿನ ಮೆದುಳು) ಸಮತೋಲನ ಮತ್ತು ಸ್ನಾಯು ಸಮನ್ವಯವನ್ನು ನಿಯಂತ್ರಿಸುತ್ತದೆ." },
                { q: "ಬೆಳಕಿನ ಪ್ರತಿಫಲನದ ನಿಯಮ: ಪತನ ಕೋನ = ?", options: ["ಪ್ರತಿಫಲನ ಕೋನ", "ವಕ್ರೀಭವನ ಕೋನ", "90°", "0°"], correct: 0, subject: 'science', explanation: "ಪ್ರತಿಫಲನ ನಿಯಮದ ಪ್ರಕಾರ ಪತನ ಕೋನ = ಪ್ರತಿಫಲನ ಕೋನ." },
                { q: "ಒಂದು ಜೀವಿಯ ವೈಜ್ಞಾನಿಕ ಹೆಸರು ಯಾವ ಭಾಷೆಯಲ್ಲಿರುತ್ತದೆ?", options: ["ಇಂಗ್ಲಿಷ್", "ಲ್ಯಾಟಿನ್", "ಗ್ರೀಕ್", "ಸಂಸ್ಕೃತ"], correct: 1, subject: 'science', explanation: "ಜೀವಿಗಳ ವೈಜ್ಞಾನಿಕ ನಾಮಕರಣ ಲ್ಯಾಟಿನ್ ಭಾಷೆಯಲ್ಲಿ ಮಾಡಲಾಗುತ್ತದೆ (ದ್ವಿನಾಮ ಪದ್ಧತಿ)." },
                { q: "ವಿಟಮಿನ್ C ಕೊರತೆಯಿಂದ ಯಾವ ರೋಗ ಬರುತ್ತದೆ?", options: ["ಸ್ಕರ್ವಿ", "ರಿಕೆಟ್ಸ್", "ಬೆರಿಬೆರಿ", "ರಕ್ತಹೀನತೆ"], correct: 0, subject: 'science', explanation: "ವಿಟಮಿನ್ C ಕೊರತೆಯಿಂದ ಸ್ಕರ್ವಿ ರೋಗ ಬರುತ್ತದೆ (ಒಸಡುಗಳಿಂದ ರಕ್ತ ಸ್ರಾವ)." },
                { q: "ಭೂಮಿಯಿಂದ ಸೂರ್ಯನಿಗೆ ಇರುವ ಸರಾಸರಿ ದೂರ?", options: ["150 ದಶಲಕ್ಷ ಕಿ.ಮೀ", "1 ದಶಲಕ್ಷ ಕಿ.ಮೀ", "15 ದಶಲಕ್ಷ ಕಿ.ಮೀ", "1.5 ಶತಕೋಟಿ ಕಿ.ಮೀ"], correct: 0, subject: 'science', explanation: "ಸೂರ್ಯ ಮತ್ತು ಭೂಮಿಯ ನಡುವಿನ ಸರಾಸರಿ ದೂರ ಸುಮಾರು 150 ದಶಲಕ್ಷ (15 ಕೋಟಿ) ಕಿ.ಮೀ = 1 ಖಗೋಳ ಏಕಮಾನ (AU)." },
                // 51-60 Science
                { q: "ರಕ್ತದಲ್ಲಿ ಆಮ್ಲಜನಕ ಸಾಗಿಸುವ ಅಂಶ ಯಾವುದು?", options: ["ಶ್ವೇತ ರಕ್ತಕಣ", "ಹಿಮೋಗ್ಲೋಬಿನ್", "ಪ್ಲಾಸ್ಮಾ", "ಪ್ಲೇಟ್ಲೆಟ್"], correct: 1, subject: 'science', explanation: "ಹಿಮೋಗ್ಲೋಬಿನ್ ಎಂಬ ಪ್ರೋಟೀನ್ ರಕ್ತದಲ್ಲಿ ಆಮ್ಲಜನಕವನ್ನು ಸಾಗಿಸುತ್ತದೆ." },
                { q: "ಸಸ್ಯಗಳಲ್ಲಿ ಆಹಾರ ಸಾಗಿಸುವ ಅಂಗಾಂಶ?", options: ["ಜೈಲಂ", "ಫ್ಲೋಯಂ", "ಎಪಿಡರ್ಮಿಸ್", "ಕಾರ್ಟೆಕ್ಸ್"], correct: 1, subject: 'science', explanation: "ಫ್ಲೋಯಂ (Phloem) ಎಲೆಗಳಲ್ಲಿ ತಯಾರಾದ ಆಹಾರವನ್ನು ಸಸ್ಯದ ಎಲ್ಲಾ ಭಾಗಗಳಿಗೆ ಸಾಗಿಸುತ್ತದೆ." },
                { q: "ಅತ್ಯಂತ ಕಠಿಣವಾದ ನೈಸರ್ಗಿಕ ವಸ್ತು ಯಾವುದು?", options: ["ಕಬ್ಬಿಣ", "ವಜ್ರ", "ಗ್ರ್ಯಾಫೈಟ್", "ಬಂಗಾರ"], correct: 1, subject: 'science', explanation: "ವಜ್ರವು ಅತ್ಯಂತ ಕಠಿಣವಾದ ನೈಸರ್ಗಿಕ ವಸ್ತು (ಮೋಹ್ಸ್ ಸ್ಕೇಲ್‌ನಲ್ಲಿ 10)." },
                { q: "ಮಾನವನಲ್ಲಿ ಎಷ್ಟು ಜ್ಞಾನೇಂದ್ರಿಯಗಳಿವೆ?", options: ["3", "4", "5", "6"], correct: 2, subject: 'science', explanation: "5 ಜ್ಞಾನೇಂದ್ರಿಯಗಳು: ಕಣ್ಣು, ಕಿವಿ, ಮೂಗು, ನಾಲಿಗೆ, ಚರ್ಮ." },
                { q: "ನೀರಿನಲ್ಲಿ ಮುಳುಗಿದ ವಸ್ತುವಿನ ಮೇಲೆ ಕಾರ್ಯನಿರ್ವಹಿಸುವ ಬಲ?", options: ["ಗುರುತ್ವ", "ಉತ್ಪ್ಲಾವಕ ಬಲ", "ಘರ್ಷಣೆ", "ಸ್ಥಿತಿಸ್ಥಾಪಕ ಬಲ"], correct: 1, subject: 'science', explanation: "ಉತ್ಪ್ಲಾವಕ ಬಲ (Buoyant force) ದ್ರವದಲ್ಲಿ ಮುಳುಗಿದ ವಸ್ತುವನ್ನು ಮೇಲಕ್ಕೆ ತಳ್ಳುತ್ತದೆ (ಆರ್ಕಿಮಿಡೀಸ್ ತತ್ವ)." },
                { q: "ಚಂದ್ರನ ಮೇಲೆ ಗುರುತ್ವಾಕರ್ಷಣೆ ಭೂಮಿಗಿಂತ ಎಷ್ಟು ಪಟ್ಟು ಕಡಿಮೆ?", options: ["1/2", "1/6", "1/4", "1/8"], correct: 1, subject: 'science', explanation: "ಚಂದ್ರನ ಗುರುತ್ವ ಭೂಮಿಯ ಸುಮಾರು 1/6 ರಷ್ಟು. ಅಂದರೆ 60 ಕೆ.ಜಿ ವ್ಯಕ್ತಿ ಚಂದ್ರನಲ್ಲಿ 10 ಕೆ.ಜಿ ತೂಗುತ್ತಾನೆ." },
                { q: "ಆಮ್ಲ ಮಳೆಗೆ ಮುಖ್ಯ ಕಾರಣ ಯಾವುದು?", options: ["CO₂", "SO₂ ಮತ್ತು NO₂", "O₂", "N₂"], correct: 1, subject: 'science', explanation: "ಸಲ್ಫರ್ ಡೈಆಕ್ಸೈಡ್ (SO₂) ಮತ್ತು ನೈಟ್ರೋಜನ್ ಡೈಆಕ್ಸೈಡ್ (NO₂) ಗಾಳಿಯಲ್ಲಿ ನೀರಿನೊಂದಿಗೆ ಸೇರಿ ಆಮ್ಲ ಮಳೆ ಉಂಟುಮಾಡುತ್ತವೆ." },
                { q: "DNA ಯ ಪೂರ್ಣ ರೂಪ ಏನು?", options: ["Deoxyribonucleic Acid", "Dinucleic Acid", "Deoxyribose Acid", "Dinitrogen Acid"], correct: 0, subject: 'science', explanation: "DNA = Deoxyribonucleic Acid. ಇದು ಆನುವಂಶಿಕ ಮಾಹಿತಿಯನ್ನು ಸಾಗಿಸುತ್ತದೆ." },
                { q: "ವಿದ್ಯುತ್ ಪ್ರವಾಹದ SI ಏಕಮಾನ?", options: ["ವೋಲ್ಟ್", "ಆಂಪಿಯರ್", "ಓಮ್", "ವಾಟ್"], correct: 1, subject: 'science', explanation: "ವಿದ್ಯುತ್ ಪ್ರವಾಹದ SI ಏಕಮಾನ ಆಂಪಿಯರ್ (A)." },
                { q: "ಸೂರ್ಯನ ಶಕ್ತಿಯ ಮೂಲ ಯಾವುದು?", options: ["ಉರಿಯುವ ಅನಿಲ", "ಪರಮಾಣು ಸಮ್ಮಿಳನ", "ಪರಮಾಣು ವಿಭಜನ", "ರಾಸಾಯನಿಕ ಕ್ರಿಯೆ"], correct: 1, subject: 'science', explanation: "ಸೂರ್ಯನಲ್ಲಿ ಹೈಡ್ರೋಜನ್ ಪರಮಾಣುಗಳ ಸಮ್ಮಿಳನದಿಂದ ಹೀಲಿಯಂ ಉತ್ಪತ್ತಿಯಾಗಿ ಬೃಹತ್ ಶಕ್ತಿ ಬಿಡುಗಡೆಯಾಗುತ್ತದೆ." },
                // 61-70 Science
                { q: "ಒಂದು ವಸ್ತುವಿನ ವೇಗ = ?", options: ["ದೂರ × ಕಾಲ", "ದೂರ / ಕಾಲ", "ಕಾಲ / ದೂರ", "ದೂರ + ಕಾಲ"], correct: 1, subject: 'science', explanation: "ವೇಗ = ದೂರ / ಕಾಲ (v = d/t)." },
                { q: "ಮನುಷ್ಯನಲ್ಲಿ ಎಷ್ಟು ಸ್ನಾಯುಗಳಿವೆ?", options: ["206", "600 ಕ್ಕಿಂತ ಹೆಚ್ಚು", "300", "150"], correct: 1, subject: 'science', explanation: "ಮಾನವ ದೇಹದಲ್ಲಿ 600 ಕ್ಕಿಂತ ಹೆಚ್ಚು ಸ್ನಾಯುಗಳಿವೆ." },
                { q: "ಗ್ರೀನ್ ಹೌಸ್ ಅನಿಲ ಯಾವುದು?", options: ["O₂", "CO₂", "N₂", "H₂"], correct: 1, subject: 'science', explanation: "ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್ (CO₂) ಪ್ರಮುಖ ಗ್ರೀನ್ ಹೌಸ್ ಅನಿಲ, ಇದು ಜಾಗತಿಕ ತಾಪಮಾನ ಏರಿಕೆಗೆ ಕಾರಣ." },
                { q: "ಬೆಳಕಿನ ಏಳು ಬಣ್ಣಗಳನ್ನು ಒಟ್ಟಿಗೆ ಸೇರಿಸಿದಾಗ ಯಾವ ಬಣ್ಣ ಬರುತ್ತದೆ?", options: ["ಕಪ್ಪು", "ಬಿಳಿ", "ಕೆಂಪು", "ನೀಲಿ"], correct: 1, subject: 'science', explanation: "ಏಳು ಬಣ್ಣಗಳನ್ನು ಸೇರಿಸಿದಾಗ ಬಿಳಿ ಬೆಳಕು ಉಂಟಾಗುತ್ತದೆ (ನ್ಯೂಟನ್ ರಿಂಗ್ ಪ್ರಯೋಗ)." },
                { q: "ಅತಿ ಸಣ್ಣ ಜೀವಿ ಯಾವುದು?", options: ["ಬ್ಯಾಕ್ಟೀರಿಯಾ", "ವೈರಸ್", "ಫಂಗಸ್", "ಪ್ರೋಟೋಜೋವಾ"], correct: 1, subject: 'science', explanation: "ವೈರಸ್ ಅತಿ ಸಣ್ಣ ಜೀವಿ, ಇದನ್ನು ಎಲೆಕ್ಟ್ರಾನ್ ಸೂಕ್ಷ್ಮದರ್ಶಕದಲ್ಲಿ ಮಾತ್ರ ನೋಡಬಹುದು." },
                { q: "ನ್ಯೂಟನ್‌ನ ಮೂರನೇ ನಿಯಮ ಯಾವುದು?", options: ["ಜಡತ್ವ ನಿಯಮ", "ಬಲ = ರಾಶಿ × ವೇಗೋತ್ಕರ್ಷ", "ಪ್ರತಿ ಕ್ರಿಯೆಗೆ ಸಮಾನ ಮತ್ತು ವಿರುದ್ಧ ಪ್ರತಿಕ್ರಿಯೆ", "ಶಕ್ತಿ ಸಂರಕ್ಷಣೆ"], correct: 2, subject: 'science', explanation: "ನ್ಯೂಟನ್‌ನ ಮೂರನೇ ನಿಯಮ: ಪ್ರತಿ ಕ್ರಿಯೆಗೆ ಸಮಾನ ಮತ್ತು ವಿರುದ್ಧ ದಿಕ್ಕಿನ ಪ್ರತಿಕ್ರಿಯೆ ಇರುತ್ತದೆ." },
                { q: "ಮಾನವನ ಚರ್ಮದಲ್ಲಿ ಯಾವ ವಿಟಮಿನ್ ಸೂರ್ಯನ ಬೆಳಕಿನಿಂದ ಉತ್ಪತ್ತಿಯಾಗುತ್ತದೆ?", options: ["ವಿಟಮಿನ್ A", "ವಿಟಮಿನ್ B", "ವಿಟಮಿನ್ C", "ವಿಟಮಿನ್ D"], correct: 3, subject: 'science', explanation: "ಸೂರ್ಯನ ಬೆಳಕಿನ UV ಕಿರಣಗಳಿಂದ ಚರ್ಮದಲ್ಲಿ ವಿಟಮಿನ್ D ಉತ್ಪತ್ತಿಯಾಗುತ್ತದೆ." },
                { q: "ಅತ್ಯಂತ ಹಗುರವಾದ ಧಾತು ಯಾವುದು?", options: ["ಹೈಡ್ರೋಜನ್", "ಹೀಲಿಯಂ", "ಲಿಥಿಯಂ", "ಆಮ್ಲಜನಕ"], correct: 0, subject: 'science', explanation: "ಹೈಡ್ರೋಜನ್ ಅತ್ಯಂತ ಹಗುರವಾದ ಧಾತು (ಪರಮಾಣು ಸಂಖ್ಯೆ 1)." },
                { q: "ಸಸ್ಯಗಳಿಗೆ ಹಸಿರು ಬಣ್ಣ ನೀಡುವ ವರ್ಣದ್ರವ್ಯ?", options: ["ಕ್ಯಾರೋಟಿನ್", "ಕ್ಲೋರೊಫಿಲ್", "ಆಂಥೋಸಯನಿನ್", "ಕ್ಸ್ಯಾಂಥೋಫಿಲ್"], correct: 1, subject: 'science', explanation: "ಕ್ಲೋರೊಫಿಲ್ ವರ್ಣದ್ರವ್ಯ ಸಸ್ಯಗಳಿಗೆ ಹಸಿರು ಬಣ್ಣ ನೀಡುತ್ತದೆ ಮತ್ತು ದ್ಯುತಿಸಂಶ್ಲೇಷಣೆಯಲ್ಲಿ ಸಹಾಯ ಮಾಡುತ್ತದೆ." },
                { q: "ಮಾನವನ ಮೆದುಳಿನ ತೂಕ ಸುಮಾರು ಎಷ್ಟು?", options: ["500 ಗ್ರಾಂ", "1.4 ಕೆ.ಜಿ", "2.5 ಕೆ.ಜಿ", "800 ಗ್ರಾಂ"], correct: 1, subject: 'science', explanation: "ವಯಸ್ಕ ಮಾನವನ ಮೆದುಳಿನ ತೂಕ ಸುಮಾರು 1.4 ಕೆ.ಜಿ (1400 ಗ್ರಾಂ)." },
                // 71-80 Science
                { q: "ಸೌರಮಂಡಲದಲ್ಲಿ ಎಷ್ಟು ಗ್ರಹಗಳಿವೆ?", options: ["7", "8", "9", "10"], correct: 1, subject: 'science', explanation: "ಸೌರಮಂಡಲದಲ್ಲಿ 8 ಗ್ರಹಗಳಿವೆ (2006 ರಲ್ಲಿ ಪ್ಲುಟೋ ಕೈಬಿಡಲಾಯಿತು)." },
                { q: "ಭೂಮಿಯ ಉಪಗ್ರಹ ಯಾವುದು?", options: ["ಸೂರ್ಯ", "ಚಂದ್ರ", "ಮಂಗಳ", "ಶುಕ್ರ"], correct: 1, subject: 'science', explanation: "ಚಂದ್ರ ಭೂಮಿಯ ಏಕೈಕ ನೈಸರ್ಗಿಕ ಉಪಗ್ರಹ." },
                { q: "ಬೆಳಕಿನ ವೇಗವು ಯಾವ ಮಾಧ್ಯಮದಲ್ಲಿ ಅತಿ ಹೆಚ್ಚು?", options: ["ಗಾಳಿ", "ನೀರು", "ನಿರ್ವಾತ", "ಗಾಜು"], correct: 2, subject: 'science', explanation: "ಬೆಳಕಿನ ವೇಗ ನಿರ್ವಾತದಲ್ಲಿ ಅತಿ ಹೆಚ್ಚು (3×10⁸ m/s)." },

                { q: "ಒಂದು ತ್ರಿಭುಜದ ಮೂರು ಕೋನಗಳ ಮೊತ್ತ ಎಷ್ಟು?", options: ["90°", "180°", "270°", "360°"], correct: 1, subject: 'maths', explanation: "ಯಾವುದೇ ತ್ರಿಭುಜದ ಒಳಕೋನಗಳ ಮೊತ್ತ ಸದಾ 180 ಡಿಗ್ರಿ." },
                { q: "25% ಅನ್ನು ಭಿನ್ನರಾಶಿಯಲ್ಲಿ ಬರೆಯಿರಿ.", options: ["1/2", "1/4", "1/5", "1/3"], correct: 1, subject: 'maths', explanation: "25% = 25/100 = 1/4." },
                { q: "7² ಎಷ್ಟು?", options: ["14", "49", "77", "21"], correct: 1, subject: 'maths', explanation: "7² = 7×7 = 49." },
                { q: "ಒಂದು ಚೌಕದ ಬಾಹುವಿನ ಉದ್ದ 5 ಸೆಂ.ಮೀ. ಅದರ ವಿಸ್ತೀರ್ಣ ಎಷ್ಟು?", options: ["25 cm²", "20 cm²", "10 cm²", "15 cm²"], correct: 0, subject: 'maths', explanation: "ಚೌಕದ ವಿಸ್ತೀರ್ಣ = ಬಾಹು × ಬಾಹು = 5×5 = 25 cm²." },
                { q: "√144 ಎಷ್ಟು?", options: ["12", "14", "16", "18"], correct: 0, subject: 'maths', explanation: "12×12 = 144, ಆದ್ದರಿಂದ √144 = 12." },
                { q: "0.5 ಅನ್ನು ಶೇಕಡಾವಾರಾಗಿ ಬರೆಯಿರಿ.", options: ["5%", "50%", "0.5%", "500%"], correct: 1, subject: 'maths', explanation: "0.5 × 100 = 50%." },
                { q: "ಒಂದು ಸಂಖ್ಯೆಯ 10% = 50 ಆದರೆ ಆ ಸಂಖ್ಯೆ ಎಷ್ಟು?", options: ["500", "100", "50", "1000"], correct: 0, subject: 'maths', explanation: "10% = 50 ⇒ 1% = 5 ⇒ 100% = 500." },
                { q: "ಸರಾಸರಿ ಕಂಡುಹಿಡಿಯಿರಿ: 4, 8, 12, 16", options: ["10", "12", "8", "14"], correct: 0, subject: 'maths', explanation: "ಮೊತ್ತ = 4+8+12+16 = 40, ಸಂಖ್ಯೆಗಳು = 4, ಸರಾಸರಿ = 40/4 = 10." },
                { q: "ಒಂದು ಆಯತದ ಉದ್ದ 8 ಸೆಂ.ಮೀ, ಅಗಲ 5 ಸೆಂ.ಮೀ. ಅದರ ಸುತ್ತಳತೆ ಎಷ್ಟು?", options: ["26 cm", "40 cm", "13 cm", "30 cm"], correct: 0, subject: 'maths', explanation: "ಸುತ್ತಳತೆ = 2(ಉದ್ದ+ಅಗಲ) = 2(8+5) = 2×13 = 26 cm." },

                { q: "15 ಮತ್ತು 25 ರ ಮ.ಸಾ.ಅ. (GCD) ಎಷ್ಟು?", options: ["5", "15", "25", "75"], correct: 0, subject: 'maths', explanation: "15 = 3×5, 25 = 5×5. ಸಾಮಾನ್ಯ ಅಪವರ್ತನ 5, ಆದ್ದರಿಂದ GCD = 5." },

                { q: "ಸಮೀಕರಣ: x + 5 = 12, x = ?", options: ["7", "17", "5", "12"], correct: 0, subject: 'maths', explanation: "x = 12 - 5 = 7." },

                { q: "ಒಂದು ಸಂಖ್ಯೆಯ 8/15 ಭಾಗ = 48, ಸಂಖ್ಯೆ?", options: ["90", "80", "100", "96"], correct: 0, subject: 'maths', explanation: "(8/15)x = 48 ⇒ x = 90." },
                { q: "ಒಂದು ಸಂಖ್ಯೆಯ 48% = 144, ಸಂಖ್ಯೆ?", options: ["300", "280", "320", "250"], correct: 0, subject: 'maths', explanation: "48% = 144 ⇒ 100% = 300." },
                { q: "ಸಮೀಕರಣ 13x - 9 = 82, x = ?", options: ["7", "8", "6", "9"], correct: 0, subject: 'maths', explanation: "13x = 91 ⇒ x = 7." },
                { q: "ಒಂದು ಸಂಖ್ಯೆಯ 72% = 360, ಸಂಖ್ಯೆ?", options: ["500", "450", "550", "600"], correct: 0, subject: 'maths', explanation: "72% = 360 ⇒ 100% = 500." },
                { q: "ಒಂದು ಸಂಖ್ಯೆಯ 9/16 ಭಾಗ = 63, ಸಂಖ್ಯೆ?", options: ["112", "108", "120", "96"], correct: 0, subject: 'maths', explanation: "(9/16)x = 63 ⇒ x = 112." },
                { q: "ಒಂದು ಸಂಖ್ಯೆಯ 58% = 232, ಸಂಖ್ಯೆ?", options: ["400", "380", "420", "450"], correct: 0, subject: 'maths', explanation: "58% = 232 ⇒ 100% = 400." },
                { q: "ಸಮೀಕರಣ 14x + 6 = 132, x = ?", options: ["9", "8", "10", "7"], correct: 0, subject: 'maths', explanation: "14x = 126 ⇒ x = 9." },
                { q: "ಒಂದು ಸಂಖ್ಯೆಯ 88% = 440, ಸಂಖ್ಯೆ?", options: ["500", "480", "520", "550"], correct: 0, subject: 'maths', explanation: "88% = 440 ⇒ 100% = 500." },
                { q: "ಒಂದು ಸಂಖ್ಯೆಯ 11/20 ಭಾಗ = 55, ಸಂಖ್ಯೆ?", options: ["100", "110", "90", "120"], correct: 0, subject: 'maths', explanation: "(11/20)x = 55 ⇒ x = 100." },
                { q: "ಒಂದು ಸಂಖ್ಯೆಯ 97% = 485, ಸಂಖ್ಯೆ?", options: ["500", "450", "550", "600"], correct: 0, subject: 'maths', explanation: "97% = 485 ⇒ 100% = 500." }
            ];

            // Verify count
            const totalQuestions = questionsData.length; // should be 200

            // State
            let userAnswers = new Array(totalQuestions).fill(null);
            let quizSubmitted = false;
            let currentFilter = 'all'; // 'all', 'science', 'maths'

            // DOM elements
            const questionsGrid = document.getElementById('questionsGrid');
            const progressText = document.getElementById('progressText');
            const liveScore = document.getElementById('liveScore');
            const submitBtn = document.getElementById('submitBtn');
            const resetBtn = document.getElementById('resetBtn');
            const resultPanel = document.getElementById('resultPanel');
            const finalScore = document.getElementById('finalScore');
            const resultMessage = document.getElementById('resultMessage');
            const sectionBreakdown = document.getElementById('sectionBreakdown');
            const paginationInfo = document.getElementById('paginationInfo');
            const filterBtns = document.querySelectorAll('.filter-btn');

            // Count by subject
            const scienceCount = questionsData.filter(q => q.subject === 'science').length;
            const mathsCount = questionsData.filter(q => q.subject === 'maths').length;

            function updateProgressAndLiveScore() {
                const answeredCount = userAnswers.filter(a => a !== null).length;
                progressText.textContent = `${answeredCount} / ${totalQuestions} ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಲಾಗಿದೆ`;

                if (!quizSubmitted) {
                    let correctCount = 0;
                    userAnswers.forEach((ans, idx) => {
                        if (ans !== null && ans === questionsData[idx].correct) {
                            correctCount++;
                        }
                    });
                    liveScore.textContent = `ಅಂಕ: ${correctCount}`;
                }
            }

            function getFilteredIndices() {
                if (currentFilter === 'all') {
                    return questionsData.map((_, i) => i);
                }
                return questionsData
                    .map((q, i) => q.subject === currentFilter ? i : -1)
                    .filter(i => i !== -1);
            }

            function renderQuestions() {
                const indices = getFilteredIndices();
                let html = '';

                // Update pagination info
                const startNum = indices.length > 0 ? indices[0] + 1 : 0;
                const endNum = indices.length > 0 ? indices[indices.length - 1] + 1 : 0;
                paginationInfo.textContent = `${indices.length} ಪ್ರಶ್ನೆಗಳು ತೋರಿಸಲಾಗಿದೆ (ಸಂಖ್ಯೆ ${startNum} ರಿಂದ ${endNum})`;

                indices.forEach((index) => {
                    const q = questionsData[index];
                    const selectedOption = userAnswers[index];
                    const isCorrect = (selectedOption !== null && selectedOption === q.correct);
                    const highlightClass = (quizSubmitted && selectedOption !== null) 
                        ? (isCorrect ? 'correct-highlight' : 'wrong-highlight') 
                        : '';
                    const subjectLabel = q.subject === 'science' ? 'ವಿಜ್ಞಾನ' : 'ಗಣಿತ';
                    const subjectClass = q.subject === 'science' ? 'science' : 'maths';

                    html += `<div class="question-card ${highlightClass}" data-qidx="${index}">`;
                    html += `<div class="q-num">${index + 1}</div>`;
                    html += `<div class="q-text">${q.q} <span class="subject-tag ${subjectClass}">${subjectLabel}</span></div>`;
                    html += `<div class="options">`;

                    q.options.forEach((opt, optIndex) => {
                        const checked = (selectedOption === optIndex) ? 'checked' : '';
                        const selectedClass = (selectedOption === optIndex) ? 'selected' : '';
                        html += `<label class="option-item ${selectedClass}">`;
                        html += `<input type="radio" name="q${index}" value="${optIndex}" data-qidx="${index}" data-optidx="${optIndex}" ${checked}>`;
                        html += `${opt}`;
                        html += `</label>`;
                    });

                    html += `</div>`;

                    const explanationVisible = quizSubmitted ? 'show' : '';
                    html += `<div class="explanation-box ${explanationVisible}" id="explain-${index}">`;
                    html += `<strong>💡 ವಿವರಣೆ:</strong> ${q.explanation}`;
                    html += `</div>`;

                    html += `</div>`;
                });

                questionsGrid.innerHTML = html;

                if (!quizSubmitted) {
                    document.querySelectorAll('input[type="radio"]').forEach(radio => {
                        radio.addEventListener('change', function(e) {
                            if (quizSubmitted) return;
                            const qIdx = parseInt(this.dataset.qidx);
                            const optIdx = parseInt(this.dataset.optidx);
                            userAnswers[qIdx] = optIdx;

                            const parentCard = this.closest('.question-card');
                            parentCard.querySelectorAll('.option-item').forEach(label => {
                                label.classList.remove('selected');
                            });
                            this.closest('.option-item').classList.add('selected');

                            updateProgressAndLiveScore();
                        });
                    });
                }
            }

            function resetQuiz() {
                userAnswers = new Array(totalQuestions).fill(null);
                quizSubmitted = false;
                currentFilter = 'all';
                filterBtns.forEach(b => b.classList.remove('active'));
                document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
                resultPanel.classList.add('hidden');
                renderQuestions();
                updateProgressAndLiveScore();
                liveScore.textContent = `ಅಂಕ: 0`;
                questionsGrid.scrollTop = 0;
            }

            function submitQuiz() {
                if (quizSubmitted) return;

                let score = 0;
                let scienceScore = 0;
                let mathsScore = 0;

                userAnswers.forEach((ans, idx) => {
                    if (ans !== null && ans === questionsData[idx].correct) {
                        score++;
                        if (questionsData[idx].subject === 'science') scienceScore++;
                        else mathsScore++;
                    }
                });

                quizSubmitted = true;

                finalScore.innerHTML = `${score}<small>/${totalQuestions}</small>`;
                let message = '';
                const percent = (score / totalQuestions) * 100;
                if (percent >= 90) message = '🏆 ಅದ್ಭುತ! ನೀವು ಎನ್‌ಎಂಎಂಎಸ್‌ಗೆ ಸಿದ್ಧರು!';
                else if (percent >= 75) message = '🌟 ತುಂಬಾ ಚೆನ್ನಾಗಿದೆ! ಇನ್ನಷ್ಟು ಅಭ್ಯಾಸ ಮಾಡಿ.';
                else if (percent >= 50) message = '📚 ಉತ್ತಮ ಪ್ರಯತ್ನ! ಸುಧಾರಣೆಗೆ ಅವಕಾಶವಿದೆ.';
                else message = '💪 ಇನ್ನಷ್ಟು ಅಭ್ಯಾಸ ಮಾಡಿ, ನೀವು ಖಂಡಿತ ಗೆಲ್ಲುತ್ತೀರಿ!';
                resultMessage.textContent = message;

                // Section breakdown
                sectionBreakdown.innerHTML = `
                    <div class="breakdown-item">🔬 ವಿಜ್ಞಾನ: ${scienceScore}/${scienceCount}</div>
                    <div class="breakdown-item">📐 ಗಣಿತ: ${mathsScore}/${mathsCount}</div>
                `;

                resultPanel.classList.remove('hidden');
                liveScore.textContent = `ಅಂಕ: ${score}`;

                // Re-render with highlights and explanations
                currentFilter = 'all';
                filterBtns.forEach(b => b.classList.remove('active'));
                document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
                renderQuestions();

                resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            function init() {
                renderQuestions();
                updateProgressAndLiveScore();

                submitBtn.addEventListener('click', submitQuiz);
                resetBtn.addEventListener('click', resetQuiz);

                // Filter buttons
                filterBtns.forEach(btn => {
                    btn.addEventListener('click', function() {
                        if (quizSubmitted) return; // prevent filtering after submit
                        currentFilter = this.dataset.filter;
                        filterBtns.forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        renderQuestions();
                        updateProgressAndLiveScore();
                        questionsGrid.scrollTop = 0;
                    });
                });
            }

            init();
        })();
    </script>
</body>
  </html>
